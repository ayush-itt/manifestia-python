services:
  - type: web
    name: manifestia-python
    runtime: docker
    plan: standard
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    disk:
      name: manifestia-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/manifestia.db
      - key: STORAGE_ROOT
        value: /var/data/storage
      - key: BYTEPLUS_API_URL
        value: https://ark.ap-southeast.bytepluses.com/api/v3
      - key: BYTEPLUS_VIDEO_MODEL
        value: dreamina-seedance-2-0-260128
      - key: BYTEPLUS_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: COVERR_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
